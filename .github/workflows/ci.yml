name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 13 1 * *"  # monthly, so the workflow is never auto-disabled for inactivity

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q   # no network: every test runs on synthetic data
